<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ustawienia konta - Sakura no Sekai</title>
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="stylesheet" href="/css/sakura.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="/js/auth.js"></script>
    <script defer src="/js/settings.js"></script>
    <script defer src="/js/sakura.js"></script>
</head>
<body>
    <canvas id="sakura-canvas" aria-hidden="true"></canvas>

    <header>
        <div class="logo">🌸 <span>Sakura no Sekai</span></div>
        <nav id="nav-menu">
            <a href="index.html">Strona Główna</a>
            <a href="blog.html">Blog</a>
            <a href="chat.html">Chat</a>
            <a href="gallery.html">Galeria</a>
            <a href="about.html">O nas</a>
            <a href="rules.html">Regulamin</a>
            <a href="settings.html" id="settings-link" style="display: none;">Ustawienia</a>
        </nav>
        <div class="header-actions">
            <button id="theme-toggle" aria-label="Przełącz tryb">🌙</button>
            <div id="auth-buttons" style="display:none;">
                <a href="login.html" id="login-link" class="button-link">Zaloguj</a>
                <a href="register.html" id="register-link" class="button-link">Zarejestruj</a>
            </div>
            <div id="user-info" style="display:none;">
                <span id="user-greeting"></span>
                <button id="logout-btn" class="button-link">Wyloguj</button>
            </div>
        </div>
    </header>

    <main>
        <section id="settings-page" class="card">
            <div class="card-header">
                <h2>👤 Ustawienia Konta</h2>
            </div>
            
            <form id="settings-form" style="display:none;">
                
                <div class="settings-section">
                    <div class="settings-header">
                        <i class="fas fa-user-circle icon"></i>
                        <h2>Informacje o profilu</h2>
                    </div>
                    
                    <div class="form-group">
                        <label for="username">Nazwa użytkownika:</label>
                        <input type="text" id="username" readonly />
                    </div>

                    <div class="form-group">
                        <label for="email">Adres e-mail:</label>
                        <input type="email" id="email" readonly />
                    </div>

                    <div class="form-group">
                        <label for="bio">Bio:</label>
                        <textarea id="bio" rows="4" placeholder="Opisz siebie..."></textarea>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-header">
                        <i class="fas fa-lock icon"></i>
                        <h2>Zmień hasło</h2>
                    </div>
                    
                    <div class="form-group">
                        <label for="current-password">Obecne hasło:</label>
                        <input type="password" id="current-password" placeholder="Wprowadź obecne hasło" />
                    </div>
                    
                    <div class="form-group">
                        <label for="new-password">Nowe hasło:</label>
                        <input type="password" id="new-password" placeholder="Wprowadź nowe hasło" />
                    </div>
                </div>

                <div id="settings-message" class="muted"></div>
                <div class="form-actions">
                    <button type="submit" class="button-link">Zapisz zmiany</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 Sakura no Sekai. <a href="about.html">O nas</a></p>
    </footer>
</body>
</html>
