<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog - Sakura no Sekai</title>
  <link rel="stylesheet" href="css/blog.css" />
  <link rel="stylesheet" href="css/sakura.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script defer src="js/auth.js"></script>
  <script defer src="js/blog.js"></script>
  <script defer src="js/sakura.js"></script>
</head>
<body>
  <canvas id="sakura-canvas" aria-hidden="true"></canvas>

  <header>
    <div class="logo">🌸 <span>Sakura no Sekai</span></div>
    <nav id="nav-menu">
      <a href="index.html">Strona Główna</a>
      <a href="blog.html">Blog</a>
      <a href="chat.html">Chat</a>
      <a href="gallery.html">Galeria</a>
      <a href="about.html">O nas</a>
      <a href="rules.html">Regulamin</a>
    </nav>
    <div class="header-actions">
      <button id="theme-toggle" aria-label="Przełącz tryb">🌙</button>
      <div id="auth-buttons">
        <a href="login.html" id="login-link" class="button-link">Zaloguj</a>
        <a href="register.html" id="register-link" class="button-link">Zarejestruj</a>
      </div>
      <div id="user-info" style="display:none;">
        <span id="user-greeting"></span>
        <button id="logout-btn" class="button-link">Wyloguj</button>
      </div>
      <div id="notif-container" class="notif-bell" style="display:none;">
        🔔 <span id="notif-count">0</span>
      </div>
    </div>
  </header>

  <main>
    <section id="blog-page" class="card">
      <div class="card-header">
        <h2>📜 Blog Sakura no Sekai</h2>
        <button id="new-post-btn" class="button-link" style="display:none;">Nowy wpis</button>
      </div>
      
      <div id="post-editor" style="display:none;">
        <input type="text" id="post-title" placeholder="Tytuł wpisu..." required>
        <textarea id="post-content" placeholder="Treść wpisu..." required></textarea>
        <div class="actions">
          <button id="publish-post" class="button-link">Opublikuj</button>
          <button id="cancel-post" class="action-btn danger-btn">Anuluj</button>
        </div>
      </div>

      <div id="posts-container">
        <div id="no-posts" class="muted-message">Brak wpisów — bądź pierwszy!</div>
        <div id="posts">
          </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Sakura no Sekai. <a href="about.html">O nas</a></p>
  </footer>
</body>
</html>
