<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Sakura no Sekai</title>
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/sakura.css">
</head>
<body>
    <header>
        <div class="logo">Sakura<span>no Sekai</span></div>
        <nav>
            <a href="/">Strona główna</a>
            <a href="/blog.html">Blog</a>
            <a href="/chat.html">Chat</a>
            <a href="/gallery.html">Galeria</a>
        </nav>
        <div class="header-actions">
            <div id="auth-buttons">
                <a href="/login.html" class="button-link">Zaloguj</a>
                <a href="/register.html" class="button-link">Rejestracja</a>
            </div>
            <div id="user-info" class="hidden">
                <a href="/profile.html" id="user-profile-link" class="button-link">
                    <img id="user-avatar" src="" alt="Avatar" style="width: 24px; height: 24px; border-radius: 50%;">
                    <span id="user-username"></span>
                </a>
                <button id="logout-button" class="action-btn danger-btn">Wyloguj</button>
            </div>
            <button id="theme-toggle" class="action-btn">🌙</button>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="card-header">
                <h2>Publiczny Chat</h2>
            </div>
            <div id="chat-login-prompt" style="display: none;">
                <p>Aby dołączyć do chatu, musisz być zalogowany. <a href="/login.html">Zaloguj się</a> lub <a href="/register.html">zarejestruj się</a>.</p>
            </div>

            <div id="chat-window" class="chat-window">
                </div>

            <form id="chat-form" class="chat-form">
                <input type="text" id="chat-input" placeholder="Wpisz wiadomość..." required>
                <button type="submit" class="button-link">Wyślij</button>
            </form>

            <button id="clear-chat" class="action-btn danger-btn hidden">Wyczyść chat (Admin)</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Sakura no Sekai. Wszelkie prawa zastrzeżone.</p>
    </footer>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
