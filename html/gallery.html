<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Galeria - Sakura no Sekai</title>
  <link rel="stylesheet" href="css/gallery.css" />
  <link rel="stylesheet" href="css/sakura.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script defer src="js/auth.js"></script>
  <script defer src="js/gallery.js"></script>
  <script defer src="js/sakura.js"></script>
</head>
<body>
  <canvas id="sakura-canvas" aria-hidden="true"></canvas>

  <header>
    <div class="logo">🌸 <span>Sakura no Sekai</span></div>
    <nav id="nav-menu">
      <a href="index.html">Strona Główna</a>
      <a href="blog.html">Blog</a>
      <a href="chat.html">Chat</a>
      <a href="gallery.html">Galeria</a>
      <a href="about.html">O nas</a>
      <a href="rules.html">Regulamin</a>
    </nav>
    <div class="header-actions">
      <button id="theme-toggle" aria-label="Przełącz tryb">🌙</button>
      <div id="auth-buttons">
        <a href="login.html" id="login-link" class="button-link">Zaloguj</a>
        <a href="register.html" id="register-link" class="button-link">Zarejestruj</a>
      </div>
      <div id="user-info" style="display:none;">
        <span id="user-greeting"></span>
        <button id="logout-btn" class="button-link">Wyloguj</button>
      </div>
    </div>
  </header>

  <main>
    <section id="gallery-page" class="card">
      <div class="card-header">
        <h2>🖼️ Galeria Użytkowników</h2>
      </div>

      <div class="gallery-info">
        <p>Przeciągnij i upuść obrazek, aby dodać go do galerii.</p>
      </div>
      
      <div id="drop-zone" class="drop-zone">
        <p>Przeciągnij i upuść obrazek tutaj</p>
        <p>lub</p>
        <form id="gallery-upload">
          <input id="gallery-url" type="url" placeholder="URL obrazka..." />
          <input id="gallery-title" placeholder="Tytuł (opcjonalny)..." />
          <button id="gallery-submit" type="submit" class="button-link">Dodaj do galerii</button>
        </form>
      </div>
      
      <div id="gallery-grid" class="gallery-grid">
        </div>
        <p id="no-gallery-items" class="muted">Brak zdjęć w galerii.</p>
    </section>
  </main>

  <footer>
    <p>© 2025 Sakura no Sekai. <a href="about.html">O nas</a></p>
  </footer>
</body>
</html>
